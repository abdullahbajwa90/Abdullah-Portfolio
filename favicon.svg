<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090a10" stroke="url(#glowGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="58" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#glowGrad)" text-anchor="middle" filter="url(#neonBlur)">AB</text>
</svg>
